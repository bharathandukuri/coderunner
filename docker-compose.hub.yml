# CodeRunner - single-file deployment.
#
# Everything needed is in this one file: it pulls prebuilt images from Docker
# Hub and carries the Caddy and Prometheus configs inline, so there is nothing
# to clone and nothing to build.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${DOMAIN:-:80}
      - GRAFANA_SITE_ADDRESS=${GRAFANA_SITE_ADDRESS:-:8081}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${CADDY_PIDS_LIMIT:-100}
    deploy:
      resources:
        limits:
          cpus: '${CADDY_CPUS:-0.25}'
          memory: ${CADDY_MEMORY:-128M}

  api:
    image: ${CODERUNNER_IMAGE_NAMESPACE:-bharathandukuri}/coderunner-api:${CODERUNNER_VERSION:-latest}
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - "AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN must be set - an empty token disables auth entirely}"
      - PORT=3000
      - BODY_LIMIT=50mb
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - RATE_LIMIT_SUBMISSIONS_MAX=${RATE_LIMIT_SUBMISSIONS_MAX:-120}
      - RATE_LIMIT_SUBMISSIONS_WINDOW_MS=${RATE_LIMIT_SUBMISSIONS_WINDOW_MS:-60000}
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${API_PIDS_LIMIT:-200}
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:-0.5}'
          memory: ${API_MEMORY:-512M}

  worker:
    image: ${CODERUNNER_IMAGE_NAMESPACE:-bharathandukuri}/coderunner-worker:${CODERUNNER_VERSION:-latest}
    command: node src/queue/worker.js
    privileged: true
    cgroup: host
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_TYPE=isolate
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - DEFAULT_MEMORY_LIMIT=${DEFAULT_MEMORY_LIMIT:-256000}
      - MAX_MEMORY_LIMIT=${MAX_MEMORY_LIMIT:-512000}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - PORT=3000
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${WORKER_PIDS_LIMIT:-500}
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-1.5}'
          memory: ${WORKER_MEMORY:-4G}

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    networks:
      - docker-socket-net
    environment:
      - CONTAINERS=1
      - POST=1
      - IMAGES=1
      - EXEC=1
      - INFO=1
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - NODES=0
      - SERVICES=0
      - SECRETS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${DOCKER_PROXY_PIDS_LIMIT:-50}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  worker-db:
    image: ${CODERUNNER_IMAGE_NAMESPACE:-bharathandukuri}/coderunner-worker:${CODERUNNER_VERSION:-latest}
    command: node src/queue/worker.js
    networks:
      - default
      - docker-socket-net
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-proxy:2375
      - WORKER_TYPE=db
      - WORKER_CONCURRENCY=${WORKER_DB_CONCURRENCY:-2}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - PORT=3000
    depends_on:
      - redis
      - docker-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${WORKER_DB_PIDS_LIMIT:-300}
    deploy:
      resources:
        limits:
          cpus: '${WORKER_DB_CPUS:-1.5}'
          memory: ${WORKER_DB_MEMORY:-2G}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    pids_limit: ${REDIS_PIDS_LIMIT:-100}
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.25}'
          memory: ${REDIS_MEMORY:-384M}

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    pid: host
    pids_limit: ${NODE_EXPORTER_PIDS_LIMIT:-50}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    pids_limit: ${CADVISOR_PIDS_LIMIT:-100}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.66.0
    pids_limit: ${REDIS_EXPORTER_PIDS_LIMIT:-50}
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    pids_limit: ${ALERTMANAGER_PIDS_LIMIT:-100}
    command:
      - '--config.file=/tmp/alertmanager.yml'
      - '--storage.path=/alertmanager'
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|ALERT_WEBHOOK_URL_PLACEHOLDER|$${ALERT_WEBHOOK_URL:-http://localhost:9099/webhook}|g" /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-200}
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
      - source: alertrules_yml
        target: /etc/prometheus/alertrules.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}'
    depends_on:
      - alertmanager
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '${PROMETHEUS_CPUS:-0.25}'
          memory: ${PROMETHEUS_MEMORY:-512M}

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3001:3000"
    pids_limit: ${GRAFANA_PIDS_LIMIT:-200}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set and not equal to admin}"
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '${GRAFANA_CPUS:-0.25}'
          memory: ${GRAFANA_MEMORY:-256M}

configs:
  caddyfile:
    content: |
      {$$SITE_ADDRESS::80} {
          request_body {
              max_size 50MB
          }

          @blocked_metrics {
              path /metrics*
          }
          handle @blocked_metrics {
              respond "Forbidden" 403
          }

          reverse_proxy api:3000 {
              transport http {
                  response_header_timeout 30s
              }
          }

          encode gzip

          header {
              X-Content-Type-Options nosniff
              X-Frame-Options DENY
              Referrer-Policy strict-origin-when-cross-origin
              Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
              -Server
          }

          log {
              output file /var/log/caddy/access.log {
                  roll_size 10mb
                  roll_keep 5
                  roll_keep_for 720h
              }
              format json
          }
      }

      {$$GRAFANA_SITE_ADDRESS::8081} {
          reverse_proxy grafana:3000

          header {
              X-Content-Type-Options nosniff
              X-Frame-Options SAMEORIGIN
              Referrer-Policy strict-origin-when-cross-origin
              Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
              -Server
          }

          log {
              output file /var/log/caddy/grafana.log {
                  roll_size 10mb
                  roll_keep 5
              }
              format json
          }
      }

  prometheus_yml:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      alerting:
        alertmanagers:
          - static_configs:
              - targets: ['alertmanager:9093']
      rule_files:
        - '/etc/prometheus/alertrules.yml'
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'coderunner-api'
          static_configs:
            - targets: ['api:3000']
          metrics_path: '/metrics'
        - job_name: 'coderunner-worker'
          static_configs:
            - targets: ['worker:3000']
          metrics_path: '/metrics'
        - job_name: 'coderunner-worker-db'
          static_configs:
            - targets: ['worker-db:3000']
          metrics_path: '/metrics'
        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
        - job_name: 'redis'
          static_configs:
            - targets: ['redis-exporter:9121']

  alertrules_yml:
    content: |
      groups:
        - name: coderunner_alerts
          rules:
            - alert: DatabasePoolDepthDepleted
              expr: coderunner_pool_depth == 0
              for: 1m
              labels:
                severity: warning
            - alert: TargetDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
            - alert: QueueBacklogGrowing
              expr: coderunner_queue_size > 10
              for: 2m
              labels:
                severity: warning
            - alert: RedisDown
              expr: redis_up == 0
              for: 1m
              labels:
                severity: critical

volumes:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  default:
  docker-socket-net:
    internal: true
