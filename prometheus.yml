global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alertrules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CodeRunner API metrics
  - job_name: 'coderunner-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  # CodeRunner Worker (isolate) metrics
  - job_name: 'coderunner-worker'
    static_configs:
      - targets: ['worker:3000']
    metrics_path: '/metrics'

  # CodeRunner Worker DB (warm pools) metrics
  - job_name: 'coderunner-worker-db'
    static_configs:
      - targets: ['worker-db:3000']
    metrics_path: '/metrics'

  # Host system metrics (CPU, RAM, Disk, Load)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Container metrics (CPU, RAM, cgroups, tmpfs)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
