global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "engine", "instance", "job"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: "discord"

receivers:
  - name: "discord"
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/123/placeholder"
        send_resolved: true
