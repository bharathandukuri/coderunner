groups:
  - name: coderunner_database_pool_alerts
    rules:
      - alert: DatabasePoolDepthDepleted
        expr: coderunner_pool_depth == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Database warm pool depth depleted for {{ $labels.engine }}"
          description: "Pool has 0 warm containers available for {{ $labels.engine }} over the last 1 minute."

      - alert: DatabasePoolWaitersHigh
        expr: coderunner_pool_waiters > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of waiters in database pool for {{ $labels.engine }}"
          description: "More than 5 requests are currently queued waiting for a {{ $labels.engine }} container."

      - alert: DatabasePoolBootSlow
        expr: histogram_quantile(0.95, rate(coderunner_pool_boot_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow container boot for {{ $labels.engine }}"
          description: "95th percentile container boot duration exceeds 3 seconds for {{ $labels.engine }}."

      - alert: DatabasePoolBootFailuresSpike
        expr: rate(coderunner_pool_boot_failures_total[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container boot failure rate high for {{ $labels.engine }}"
          description: "Container boots are failing repeatedly for {{ $labels.engine }}."

      - alert: DatabasePoolAcquireWaitHigh
        expr: histogram_quantile(0.95, rate(coderunner_pool_acquire_wait_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High acquire wait latency for {{ $labels.engine }}"
          description: "Requests are waiting longer than 2 seconds to acquire a {{ $labels.engine }} container."

      - alert: DatabasePoolCircuitBreakerTripped
        expr: coderunner_pool_circuit_state > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker tripped for {{ $labels.engine }}"
          description: "Circuit breaker for {{ $labels.engine }} has tripped into half-open or open state due to consecutive boot failures."

      - alert: LeakedPoolContainers
        expr: (coderunner_pool_leaked_containers > 0) or (count(container_last_seen{name=~".*coderunner.*"}) > 25)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Leaked or untracked pool containers detected"
          description: "Container count or pool orphan tracker indicates unmanaged containers running."

  - name: coderunner_infrastructure_alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: QueueBacklogGrowing
        expr: coderunner_queue_size > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog growing"
          description: "More than 10 submissions are waiting in the queue for > 2 minutes."

      - alert: InternalErrorRateHigh
        expr: (sum(rate(coderunner_submissions_total{status="13"}[5m])) / (sum(rate(coderunner_submissions_total[5m])) + 0.0001)) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Internal error rate (status 13) exceeds 5%"
          description: "Submissions failing with internal error rate > 5% over 5 minutes."

      - alert: HighTLERatio
        expr: (sum(rate(coderunner_submissions_total{status="5"}[5m])) / (sum(rate(coderunner_submissions_total[5m])) + 0.0001)) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Time Limit Exceeded (TLE) ratio"
          description: "More than 20% of submissions are resulting in TLE (status 5)."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage exceeds 85%"
          description: "Host available memory is below 15% for more than 2 minutes."

      - alert: RootDiskHigh
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem usage exceeds 80%"
          description: "Root disk usage is above 80% for more than 2 minutes."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis server is down"
          description: "Redis instance cannot be reached by redis_exporter for 1 minute."
