services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${DOMAIN:-:80}
      - GRAFANA_SITE_ADDRESS=${GRAFANA_SITE_ADDRESS:-:8081}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPUS:-0.25}"
          memory: ${CADDY_MEMORY:-128M}
          pids: ${CADDY_PIDS_LIMIT:-100}

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - "AUTH_TOKEN=${AUTH_TOKEN:?AUTH_TOKEN must be set - an empty token disables auth entirely}"
      - PORT=3000
      - BODY_LIMIT=50mb
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - RATE_LIMIT_SUBMISSIONS_MAX=${RATE_LIMIT_SUBMISSIONS_MAX:-120}
      - RATE_LIMIT_SUBMISSIONS_WINDOW_MS=${RATE_LIMIT_SUBMISSIONS_WINDOW_MS:-60000}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-100}
      - MAX_DB_QUEUE_DEPTH=${MAX_DB_QUEUE_DEPTH:-20}
      - MAX_CONCURRENT_WAIT_REQUESTS=${MAX_CONCURRENT_WAIT_REQUESTS:-100}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - LANGUAGE_C_ENABLED=${LANGUAGE_C_ENABLED:-true}
      - LANGUAGE_C_POOL=${LANGUAGE_C_POOL:-false}
      - LANGUAGE_C_POOL_SIZE=${LANGUAGE_C_POOL_SIZE:-}
      - LANGUAGE_CPP_ENABLED=${LANGUAGE_CPP_ENABLED:-true}
      - LANGUAGE_CPP_POOL=${LANGUAGE_CPP_POOL:-false}
      - LANGUAGE_CPP_POOL_SIZE=${LANGUAGE_CPP_POOL_SIZE:-}
      - LANGUAGE_JAVA_ENABLED=${LANGUAGE_JAVA_ENABLED:-true}
      - LANGUAGE_JAVA_POOL=${LANGUAGE_JAVA_POOL:-false}
      - LANGUAGE_JAVA_POOL_SIZE=${LANGUAGE_JAVA_POOL_SIZE:-}
      - LANGUAGE_JAVASCRIPT_ENABLED=${LANGUAGE_JAVASCRIPT_ENABLED:-true}
      - LANGUAGE_JAVASCRIPT_POOL=${LANGUAGE_JAVASCRIPT_POOL:-false}
      - LANGUAGE_JAVASCRIPT_POOL_SIZE=${LANGUAGE_JAVASCRIPT_POOL_SIZE:-}
      - LANGUAGE_TYPESCRIPT_ENABLED=${LANGUAGE_TYPESCRIPT_ENABLED:-true}
      - LANGUAGE_TYPESCRIPT_POOL=${LANGUAGE_TYPESCRIPT_POOL:-false}
      - LANGUAGE_TYPESCRIPT_POOL_SIZE=${LANGUAGE_TYPESCRIPT_POOL_SIZE:-}
      - LANGUAGE_PYTHON_ENABLED=${LANGUAGE_PYTHON_ENABLED:-true}
      - LANGUAGE_PYTHON_POOL=${LANGUAGE_PYTHON_POOL:-false}
      - LANGUAGE_PYTHON_POOL_SIZE=${LANGUAGE_PYTHON_POOL_SIZE:-}
      - LANGUAGE_SQLITE_ENABLED=${LANGUAGE_SQLITE_ENABLED:-true}
      - LANGUAGE_SQLITE_POOL=${LANGUAGE_SQLITE_POOL:-false}
      - LANGUAGE_SQLITE_POOL_SIZE=${LANGUAGE_SQLITE_POOL_SIZE:-}
      - LANGUAGE_POSTGRESQL_ENABLED=${LANGUAGE_POSTGRESQL_ENABLED:-true}
      - LANGUAGE_POSTGRESQL_POOL=${LANGUAGE_POSTGRESQL_POOL:-true}
      - LANGUAGE_POSTGRESQL_POOL_SIZE=${LANGUAGE_POSTGRESQL_POOL_SIZE:-2}
      - LANGUAGE_MYSQL_ENABLED=${LANGUAGE_MYSQL_ENABLED:-true}
      - LANGUAGE_MYSQL_POOL=${LANGUAGE_MYSQL_POOL:-true}
      - LANGUAGE_MYSQL_POOL_SIZE=${LANGUAGE_MYSQL_POOL_SIZE:-2}
      - LANGUAGE_MONGODB_ENABLED=${LANGUAGE_MONGODB_ENABLED:-false}
      - LANGUAGE_MONGODB_POOL=${LANGUAGE_MONGODB_POOL:-true}
      - LANGUAGE_MONGODB_POOL_SIZE=${LANGUAGE_MONGODB_POOL_SIZE:-${WORKER_DB_CONCURRENCY:-2}}
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.5}"
          memory: ${API_MEMORY:-512M}
          pids: ${API_PIDS_LIMIT:-200}

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: node src/queue/worker.js
    privileged: true
    cgroup: host
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_TYPE=isolate
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - DEFAULT_MEMORY_LIMIT=${DEFAULT_MEMORY_LIMIT:-256000}
      - MAX_MEMORY_LIMIT=${MAX_MEMORY_LIMIT:-512000}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - PORT=3000
      - LANGUAGE_C_ENABLED=${LANGUAGE_C_ENABLED:-true}
      - LANGUAGE_C_POOL=${LANGUAGE_C_POOL:-false}
      - LANGUAGE_C_POOL_SIZE=${LANGUAGE_C_POOL_SIZE:-}
      - LANGUAGE_CPP_ENABLED=${LANGUAGE_CPP_ENABLED:-true}
      - LANGUAGE_CPP_POOL=${LANGUAGE_CPP_POOL:-false}
      - LANGUAGE_CPP_POOL_SIZE=${LANGUAGE_CPP_POOL_SIZE:-}
      - LANGUAGE_JAVA_ENABLED=${LANGUAGE_JAVA_ENABLED:-true}
      - LANGUAGE_JAVA_POOL=${LANGUAGE_JAVA_POOL:-false}
      - LANGUAGE_JAVA_POOL_SIZE=${LANGUAGE_JAVA_POOL_SIZE:-}
      - LANGUAGE_JAVASCRIPT_ENABLED=${LANGUAGE_JAVASCRIPT_ENABLED:-true}
      - LANGUAGE_JAVASCRIPT_POOL=${LANGUAGE_JAVASCRIPT_POOL:-false}
      - LANGUAGE_JAVASCRIPT_POOL_SIZE=${LANGUAGE_JAVASCRIPT_POOL_SIZE:-}
      - LANGUAGE_TYPESCRIPT_ENABLED=${LANGUAGE_TYPESCRIPT_ENABLED:-true}
      - LANGUAGE_TYPESCRIPT_POOL=${LANGUAGE_TYPESCRIPT_POOL:-false}
      - LANGUAGE_TYPESCRIPT_POOL_SIZE=${LANGUAGE_TYPESCRIPT_POOL_SIZE:-}
      - LANGUAGE_PYTHON_ENABLED=${LANGUAGE_PYTHON_ENABLED:-true}
      - LANGUAGE_PYTHON_POOL=${LANGUAGE_PYTHON_POOL:-false}
      - LANGUAGE_PYTHON_POOL_SIZE=${LANGUAGE_PYTHON_POOL_SIZE:-}
      - LANGUAGE_SQLITE_ENABLED=${LANGUAGE_SQLITE_ENABLED:-true}
      - LANGUAGE_SQLITE_POOL=${LANGUAGE_SQLITE_POOL:-false}
      - LANGUAGE_SQLITE_POOL_SIZE=${LANGUAGE_SQLITE_POOL_SIZE:-}
      - LANGUAGE_POSTGRESQL_ENABLED=${LANGUAGE_POSTGRESQL_ENABLED:-true}
      - LANGUAGE_POSTGRESQL_POOL=${LANGUAGE_POSTGRESQL_POOL:-true}
      - LANGUAGE_POSTGRESQL_POOL_SIZE=${LANGUAGE_POSTGRESQL_POOL_SIZE:-2}
      - LANGUAGE_MYSQL_ENABLED=${LANGUAGE_MYSQL_ENABLED:-true}
      - LANGUAGE_MYSQL_POOL=${LANGUAGE_MYSQL_POOL:-true}
      - LANGUAGE_MYSQL_POOL_SIZE=${LANGUAGE_MYSQL_POOL_SIZE:-2}
      - LANGUAGE_MONGODB_ENABLED=${LANGUAGE_MONGODB_ENABLED:-false}
      - LANGUAGE_MONGODB_POOL=${LANGUAGE_MONGODB_POOL:-true}
      - LANGUAGE_MONGODB_POOL_SIZE=${LANGUAGE_MONGODB_POOL_SIZE:-${WORKER_DB_CONCURRENCY:-2}}
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1.5}"
          memory: ${WORKER_MEMORY:-4G}
          pids: ${WORKER_PIDS_LIMIT:-500}

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    networks:
      - docker-socket-net
    environment:
      - CONTAINERS=1
      - POST=1
      - IMAGES=1
      - EXEC=1
      - INFO=1
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - NODES=0
      - SERVICES=0
      - SECRETS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: ${DOCKER_PROXY_PIDS_LIMIT:-50}

  worker-db:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: node src/queue/worker.js
    networks:
      - default
      - docker-socket-net
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-proxy:2375
      - WORKER_TYPE=db
      - WORKER_CONCURRENCY=${WORKER_DB_CONCURRENCY:-${WORKER_CONCURRENCY:-2}}
      - RESULT_CACHE_TTL=${RESULT_CACHE_TTL:-1800}
      - PORT=3000
      - LANGUAGE_C_ENABLED=${LANGUAGE_C_ENABLED:-true}
      - LANGUAGE_C_POOL=${LANGUAGE_C_POOL:-false}
      - LANGUAGE_C_POOL_SIZE=${LANGUAGE_C_POOL_SIZE:-}
      - LANGUAGE_CPP_ENABLED=${LANGUAGE_CPP_ENABLED:-true}
      - LANGUAGE_CPP_POOL=${LANGUAGE_CPP_POOL:-false}
      - LANGUAGE_CPP_POOL_SIZE=${LANGUAGE_CPP_POOL_SIZE:-}
      - LANGUAGE_JAVA_ENABLED=${LANGUAGE_JAVA_ENABLED:-true}
      - LANGUAGE_JAVA_POOL=${LANGUAGE_JAVA_POOL:-false}
      - LANGUAGE_JAVA_POOL_SIZE=${LANGUAGE_JAVA_POOL_SIZE:-}
      - LANGUAGE_JAVASCRIPT_ENABLED=${LANGUAGE_JAVASCRIPT_ENABLED:-true}
      - LANGUAGE_JAVASCRIPT_POOL=${LANGUAGE_JAVASCRIPT_POOL:-false}
      - LANGUAGE_JAVASCRIPT_POOL_SIZE=${LANGUAGE_JAVASCRIPT_POOL_SIZE:-}
      - LANGUAGE_TYPESCRIPT_ENABLED=${LANGUAGE_TYPESCRIPT_ENABLED:-true}
      - LANGUAGE_TYPESCRIPT_POOL=${LANGUAGE_TYPESCRIPT_POOL:-false}
      - LANGUAGE_TYPESCRIPT_POOL_SIZE=${LANGUAGE_TYPESCRIPT_POOL_SIZE:-}
      - LANGUAGE_PYTHON_ENABLED=${LANGUAGE_PYTHON_ENABLED:-true}
      - LANGUAGE_PYTHON_POOL=${LANGUAGE_PYTHON_POOL:-false}
      - LANGUAGE_PYTHON_POOL_SIZE=${LANGUAGE_PYTHON_POOL_SIZE:-}
      - LANGUAGE_SQLITE_ENABLED=${LANGUAGE_SQLITE_ENABLED:-true}
      - LANGUAGE_SQLITE_POOL=${LANGUAGE_SQLITE_POOL:-false}
      - LANGUAGE_SQLITE_POOL_SIZE=${LANGUAGE_SQLITE_POOL_SIZE:-}
      - LANGUAGE_POSTGRESQL_ENABLED=${LANGUAGE_POSTGRESQL_ENABLED:-true}
      - LANGUAGE_POSTGRESQL_POOL=${LANGUAGE_POSTGRESQL_POOL:-true}
      - LANGUAGE_POSTGRESQL_POOL_SIZE=${LANGUAGE_POSTGRESQL_POOL_SIZE:-2}
      - LANGUAGE_MYSQL_ENABLED=${LANGUAGE_MYSQL_ENABLED:-true}
      - LANGUAGE_MYSQL_POOL=${LANGUAGE_MYSQL_POOL:-true}
      - LANGUAGE_MYSQL_POOL_SIZE=${LANGUAGE_MYSQL_POOL_SIZE:-2}
      - LANGUAGE_MONGODB_ENABLED=${LANGUAGE_MONGODB_ENABLED:-false}
      - LANGUAGE_MONGODB_POOL=${LANGUAGE_MONGODB_POOL:-true}
      - LANGUAGE_MONGODB_POOL_SIZE=${LANGUAGE_MONGODB_POOL_SIZE:-${WORKER_DB_CONCURRENCY:-2}}
    depends_on:
      - redis
      - docker-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${WORKER_DB_CPUS:-1.5}"
          memory: ${WORKER_DB_MEMORY:-2G}
          pids: ${WORKER_DB_PIDS_LIMIT:-300}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-0.25}"
          memory: ${REDIS_MEMORY:-384M}
          pids: ${REDIS_PIDS_LIMIT:-100}

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: ${NODE_EXPORTER_PIDS_LIMIT:-50}

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
          pids: ${CADVISOR_PIDS_LIMIT:-100}

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.66.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
          pids: ${REDIS_EXPORTER_PIDS_LIMIT:-50}

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    command:
      - "--config.file=/tmp/alertmanager.yml"
      - "--storage.path=/alertmanager"
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$${ALERT_WEBHOOK_URL}" ]; then
          sed "s|ALERT_WEBHOOK_URL_PLACEHOLDER|$${ALERT_WEBHOOK_URL}|g" /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        else
          cp /etc/alertmanager/alertmanager.none.yml /tmp/alertmanager.yml
        fi
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager.template.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ./alertmanager.none.yml:/etc/alertmanager/alertmanager.none.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: ${ALERTMANAGER_PIDS_LIMIT:-100}

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertrules.yml:/etc/prometheus/alertrules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
    depends_on:
      - alertmanager
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPUS:-0.25}"
          memory: ${PROMETHEUS_MEMORY:-512M}
          pids: ${PROMETHEUS_PIDS_LIMIT:-200}

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set and not equal to admin}"
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPUS:-0.25}"
          memory: ${GRAFANA_MEMORY:-256M}
          pids: ${GRAFANA_PIDS_LIMIT:-200}

volumes:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  default:
  docker-socket-net:
    internal: true
